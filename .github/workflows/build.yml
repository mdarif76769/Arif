name: Build Android App

on:
  repository_dispatch:
    types: [build_app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Update Project Configuration from Dispatch
        run: |
          # অ্যাপের নাম আপডেট (strings.xml)
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ ! -z "$APP_NAME" ] && [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" app/src/main/res/values/strings.xml
          fi

          # প্যাকেজ নেম আপডেট (build.gradle)
          PKG_NAME="${{ github.event.client_payload.package_name }}"
          if [ ! -z "$PKG_NAME" ] && [ -f "app/build.gradle" ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$PKG_NAME\"/" app/build.gradle
          fi

          # সঠিক পাথ থেকে MainActivity.kt খুঁজে ওয়েব ইউআরএল আপডেট
          WEB_URL="${{ github.event.client_payload.web_url }}"
          MAIN_FILE=$(find app/src/main/java -name "MainActivity.kt" | head -n 1)
          if [ ! -z "$WEB_URL" ] && [ ! -z "$MAIN_FILE" ]; then
            sed -i "s#https://[^\"[:space:]]*#$WEB_URL#g" "$MAIN_FILE"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneratedApp
          path: app/build/outputs/apk/debug/app-debug.apk
