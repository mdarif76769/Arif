name: Build Android App

on:
  repository_dispatch:
    types: [build_app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          accept-android-sdk-licenses: true

      - name: Update Project Configuration from Dispatch
        run: |
          # অ্যাপের নাম আপডেট (strings.xml)
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ ! -z "$APP_NAME" ]; then
            sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/" app/src/main/res/values/strings.xml
          fi

          # প্যাকেজ নেম আপডেট (build.gradle)
          PKG_NAME="${{ github.event.client_payload.package_name }}"
          if [ ! -z "$PKG_NAME" ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$PKG_NAME\"/" app/build.gradle
          fi

          # ওয়েব ইউআরএল আপডেট (MainActivity.kt বা কনফিগারেশন ফাইল)
          WEB_URL="${{ github.event.client_payload.web_url }}"
          if [ ! -z "$WEB_URL" ]; then
            sed -i "s#https://mdarif76769.github.io/firebase_controller/#$WEB_URL#g" app/src/main/java/bd/supper/MainActivity.kt
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneratedApp
          path: app/build/outputs/apk/debug/app-debug.apk
